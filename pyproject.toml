[project]
name = "openenv-codereview"
version = "0.1.0"
description = "OpenEnv Code Review Environment"
requires-python = ">=3.11"
dependencies = [
    "openenv>=0.2.0",
    "openenv>=0.1.13",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=1.10.13",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:BuildBackend"
